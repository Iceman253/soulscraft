# Plain HTTP → redirect everything to HTTPS (except the health check endpoint).
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # Lightweight health endpoint for Docker HEALTHCHECK — stays on HTTP, no redirect.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — serves the app (self-signed cert generated at container start).
server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    http2        on;
    server_name  _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compress text assets on the fly.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml font/woff2;

    # Hashed build assets (Vite emits content-hashed filenames) can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback — every unknown path serves index.html so client-side
    # routing works on refresh / deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entrypoint, so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
